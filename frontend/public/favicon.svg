<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#080e1a"/>
  <!-- Blue square badge matching app logo -->
  <rect x="4" y="4" width="24" height="24" rx="4" fill="#1d3a7a"/>
  <!-- Grid lines (city grid concept) -->
  <line x1="16" y1="5" x2="16" y2="27" stroke="#3b7aeb" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="5" y1="16" x2="27" y2="16" stroke="#3b7aeb" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
  <!-- Four corner nodes -->
  <rect x="6" y="6" width="7" height="7" rx="1.5" fill="#3b7aeb" opacity="0.9"/>
  <rect x="19" y="6" width="7" height="7" rx="1.5" fill="#3b7aeb" opacity="0.9"/>
  <rect x="6" y="19" width="7" height="7" rx="1.5" fill="#3b7aeb" opacity="0.9"/>
  <rect x="19" y="19" width="7" height="7" rx="1.5" fill="#3b7aeb" opacity="0.9"/>
  <!-- Center pulse dot -->
  <circle cx="16" cy="16" r="2.5" fill="#60a5fa"/>
</svg>